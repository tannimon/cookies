<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Cookie Tin</title>
<meta name="description" content="Send someone a care package in a cookie tin. It's never cookies.">
<meta name="theme-color" content="#23409A">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23C9A13B'/><circle cx='32' cy='32' r='26' fill='%2323409A'/><ellipse cx='32' cy='32' rx='16' ry='10' fill='%23FBF3DC'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Gloock&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
:root{
  --table:#EDF2E8; --check:rgba(98,140,106,.15);
  --ink:#16213F; --muted:#56617D;
  --tin:#23409A; --tin-hi:#3358C2; --tin-deep:#15296A;
  --gold:#C9A13B; --gold-hi:#E7CB6E; --gold-deep:#9A7722;
  --paper:#FFFDF7; --card-ink:#16213F; --pen:#223066;
  --cup:#E8DBBB; --cup-pleat:#D3BF93; --cup-center:#F3EAD3;
  --jam:#B3303A; --rule:#CCD6E8; --field:#C5CCDC;
  --serif:"Gloock", Georgia, "Times New Roman", serif;
  --sans:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Homemade Apple", "Segoe Print", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --table:#18202E; --check:rgba(150,175,215,.06); --ink:#E8ECF5; --muted:#A7B1C8; }
}
:root[data-theme="dark"]{ --table:#18202E; --check:rgba(150,175,215,.06); --ink:#E8ECF5; --muted:#A7B1C8; }

*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100vh; overflow-x:hidden;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  font:1.0625rem/1.55 var(--sans); color:var(--ink);
  background-color:var(--table);
  background-image:linear-gradient(90deg,var(--check) 50%,transparent 0),linear-gradient(var(--check) 50%,transparent 0);
  background-size:32px 32px;
}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit}

/* header */
.site{max-width:1120px;margin:0 auto;padding:28px 20px 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 16px}
.wordmark{margin:0;font:400 2rem/1.1 var(--serif)}
.wordmark a{color:inherit;text-decoration:none}
.tagline{margin:0;color:var(--muted)}

/* build layout */
.build{max-width:1120px;margin:0 auto;padding:0 20px 72px;display:grid;gap:8px}
@media (min-width:900px){
  .build{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
  .build .stage{position:sticky;top:12px}
}
.stage{padding:clamp(44px,14vw,84px) clamp(36px,13vw,84px) 40px clamp(12px,4vw,28px)}

/* the tin */
.tin{position:relative;width:100%;max-width:420px;aspect-ratio:1;margin-inline:auto;container-type:inline-size}
.tin-base{position:absolute;inset:0;z-index:1;border-radius:50%;background:var(--gold);
  box-shadow:0 3.5cqi 0 var(--tin-deep),0 5cqi 7cqi rgba(16,24,48,.3)}
.tin-base::before{content:"";position:absolute;inset:2.2%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,var(--tin-hi),var(--tin) 60%,var(--tin-deep))}
.tin-liner{position:absolute;inset:5%;border-radius:50%;
  background:radial-gradient(circle closest-side,var(--paper) 85%,transparent 86%),
             repeating-conic-gradient(var(--paper) 0 4deg,#EAE2D0 4deg 8deg)}
.cups{position:absolute;inset:0}
.tin-empty{position:absolute;inset:0;display:grid;place-items:center;margin:0;font:4.4cqi var(--hand);color:#8B7B55}
.cup{position:absolute;width:17%;aspect-ratio:1;translate:-50% -50%;padding:0;border:none;border-radius:50%;cursor:pointer;
  background:repeating-conic-gradient(var(--cup) 0 7deg,var(--cup-pleat) 7deg 14deg);
  box-shadow:0 .6cqi 1.2cqi rgba(70,50,15,.28);transition:scale .15s ease}
.cup:hover{scale:1.07}
.cup-inner{position:absolute;inset:14%;border-radius:50%;display:grid;place-items:center;
  background-color:var(--cup-center);background-size:cover;background-position:center;
  font:6cqi/1 var(--serif);color:var(--tin-deep)}
.cup-inner.cookie{
  background-image:
    radial-gradient(circle at 32% 34%,#fff 0 3%,transparent 3.6%),
    radial-gradient(circle at 70% 40%,#fff 0 2.6%,transparent 3.2%),
    radial-gradient(circle at 46% 76%,#fff 0 2.8%,transparent 3.4%),
    radial-gradient(circle at 64% 22%,#fff 0 2.2%,transparent 2.8%),
    radial-gradient(circle at 24% 62%,#fff 0 2.4%,transparent 3%),
    radial-gradient(circle,transparent 0 18%,#9C6A26 19% 22%,#E3B96C 23% 56%,#CE9A4A 72%,#A9742E 88%,transparent 89%)}
.cup.opened .cup-inner{opacity:.92}

.lid{position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:0;border:none;border-radius:50%;
  background:var(--gold);color:var(--card-ink);cursor:pointer;
  box-shadow:0 2.5cqi 0 var(--gold-deep),0 4cqi 7cqi rgba(16,24,48,.32)}
.lid::before{content:"";position:absolute;inset:2.4%;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,var(--tin-hi),var(--tin) 55%,var(--tin-deep))}
.lid::after{content:"";position:absolute;inset:8%;border-radius:50%;border:.9cqi dotted var(--gold-hi)}
.lid-oval{position:relative;z-index:1;width:66%;padding:5.5cqi 4cqi;border-radius:50%;background:#FBF3DC;
  display:flex;flex-direction:column;align-items:center;gap:.6cqi;text-align:center;
  box-shadow:0 0 0 1cqi var(--gold),0 0 0 1.7cqi var(--tin-deep)}
.lid-small{font:italic 3.4cqi/1.2 var(--sans);color:#6B5A2E}
.lid-name{font:8.5cqi/1.05 var(--serif);color:var(--tin-deep);max-width:100%;overflow-wrap:anywhere}
.lid-from{font:3.6cqi/1.2 var(--sans);color:#6B5A2E;min-height:1em}
.tin.parked .lid{transform:translate(48%,-48%) scale(.4) rotate(14deg);pointer-events:none}
.tin.opening .lid{animation:lidoff .95s cubic-bezier(.45,0,.2,1) forwards;pointer-events:none}
.lid.nudge{animation:nudge .7s ease-in-out 1}
@keyframes lidoff{
  0%{transform:none}
  30%{transform:translateY(-7%) scale(1.04) rotate(-4deg)}
  100%{transform:translate(48%,-48%) scale(.4) rotate(14deg)}
}
@keyframes nudge{0%,100%{transform:none}25%{transform:rotate(-3deg)}55%{transform:rotate(2.5deg)}80%{transform:rotate(-1deg)}}

/* the sheet (builder form) */
.sheet{background:var(--paper);color:var(--card-ink);border-radius:6px;padding:clamp(20px,4vw,36px);
  box-shadow:0 1px 2px rgba(22,33,63,.08),0 18px 40px -20px rgba(22,33,63,.35)}
.sheet h2{margin:0 0 .4rem;font:400 1.6rem/1.2 var(--serif)}
.sheet section + section{margin-top:2rem;padding-top:1.75rem;border-top:1.5px dashed var(--rule)}
.help{margin:.2rem 0 1rem;color:#56617D;font-size:.95rem}
.field{display:block;margin-bottom:.9rem}
.field > span{display:block;margin-bottom:.3rem;font-weight:700;font-size:.95rem}
input,textarea{width:100%;font:inherit;color:var(--card-ink);background:#fff;border:1.5px solid var(--field);border-radius:6px;padding:.6rem .75rem}
textarea{min-height:5.5rem;resize:vertical}
input[aria-invalid],textarea[aria-invalid]{border-color:var(--jam)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
.err{margin:.3rem 0 0;color:var(--jam);font-size:.9rem}

.btn{display:inline-block;padding:.8rem 1.15rem;border:1.5px solid var(--tin);border-radius:8px;background:var(--tin);color:#fff;
  font:700 1rem/1 var(--sans);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--tin-deep);border-color:var(--tin-deep)}
.btn.ghost{background:transparent;color:var(--tin)}
.btn.ghost:hover{background:#EEF2FB}
.btn.plain{padding:.55rem .25rem;border-color:transparent;background:transparent;color:var(--tin);text-decoration:underline;text-underline-offset:3px}
.btn.plain:hover{background:transparent;color:var(--tin-deep)}
.btn.plain.danger{color:var(--jam)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.actions.center{justify-content:center}

.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.type-btn{display:flex;align-items:center;gap:.6rem;padding:.55rem .7rem;border:1.5px dashed #B6BFD3;border-radius:8px;
  background:transparent;color:var(--card-ink);text-align:left;cursor:pointer}
.type-btn:hover{background:#F3F5FA;border-style:solid}
.type-btn:disabled{opacity:.45;cursor:not-allowed}
.mini-cup{flex:none;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;
  background:repeating-conic-gradient(var(--cup) 0 10deg,var(--cup-pleat) 10deg 20deg)}
.mini-cup span{width:72%;height:72%;border-radius:50%;display:grid;place-items:center;background:var(--cup-center);font:1rem/1 var(--serif);color:var(--tin-deep)}

.editor{margin:1rem 0 .5rem;padding:1rem 1rem .75rem;border-radius:8px;background:#F6F2E6;border:1.5px solid #E1D6B8}
.editor h3{margin:0 0 .5rem;font:400 1.3rem/1.2 var(--serif)}

.items{list-style:none;margin:1rem 0 0;padding:0}
.items li{display:flex;align-items:center;gap:.7rem;padding:.55rem 0;border-bottom:1px solid #ECEFF5}
.summary{flex:1;min-width:0}
.summary b{display:block;font-size:.85rem;color:#56617D}
.summary span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:2px}
.icon-btn{padding:.35rem .55rem;border:none;border-radius:6px;background:transparent;color:var(--tin);font-size:.95rem;cursor:pointer}
.icon-btn:hover{background:#EEF2FB}
.icon-btn:disabled{opacity:.3;cursor:default;background:transparent}

.linkout{display:grid;gap:10px;margin-top:1rem}
.linkout:empty{display:none}
.linkout input{font-size:.9rem}
.copied{color:#2F6B3A;font-weight:700;font-size:.95rem}
.warn{margin:0;padding:.6rem .75rem;border-radius:6px;background:#FFF4DA;font-size:.92rem}
.startover{margin-top:1.5rem}

/* receive */
.receive{max-width:640px;margin:0 auto;padding:0 20px 72px;text-align:center}
.receive .stage{padding:clamp(48px,14vw,90px) clamp(36px,13vw,90px) 40px}
.receive .tin{max-width:460px}
.hint{min-height:1.6em;margin:.25rem 0 0;color:var(--muted)}
.slip{display:inline-block;max-width:30rem;margin:1.5rem 0 0;padding:1rem 1.5rem;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;
  background:var(--paper);color:var(--pen);font:1.05rem/2.1 var(--hand);transform:rotate(-1.2deg);
  box-shadow:0 10px 24px -12px rgba(16,24,48,.4)}
.done p{margin:1.75rem 0 1rem;font:400 1.5rem/1.3 var(--serif)}
.on-table .btn.plain{color:var(--ink)}
.preview-bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 14px;
  padding:.6rem 1rem;background:var(--tin);color:#fff}
.preview-bar .btn{padding:.5rem .9rem;background:#fff;color:var(--tin);border-color:#fff}
.error-sheet{margin-top:40px;text-align:left}

/* viewer */
dialog#viewer{width:min(560px,92vw);max-height:94vh;padding:0;border:none;background:transparent;color:var(--card-ink);overflow:visible}
#viewer::backdrop{background:rgba(14,22,46,.62)}
.card{position:relative;margin:0;max-height:calc(94vh - 72px);overflow:auto;padding:1.75rem 1.5rem 1.5rem;border-radius:6px;
  background:var(--paper);text-align:left;box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.card h3{margin:0 0 .9rem;padding-right:2.5rem;font:400 1.75rem/1.15 var(--serif)}
.card .btn{margin-top:.25rem}
.x{position:absolute;top:.5rem;right:.5rem;z-index:2;width:2.25rem;height:2.25rem;border:none;border-radius:50%;
  background:rgba(22,33,63,.08);color:var(--card-ink);font:1.4rem/1 var(--sans);cursor:pointer}
.x:hover{background:rgba(22,33,63,.15)}
.cardnav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.chip{padding:.55rem 1rem;border:none;border-radius:999px;background:var(--paper);color:var(--tin);font:700 .95rem/1 var(--sans);cursor:pointer}
.chip:disabled{opacity:.35;cursor:default}
.count{color:#fff;font-size:.95rem}
.caption{margin:.9rem 0 0;font:1.05rem/1.9 var(--hand);color:var(--pen)}
.embed{width:100%;border-radius:10px;overflow:hidden}
.embed.video{aspect-ratio:16/9;background:#000}
.embed iframe{display:block;width:100%;height:100%;border:0}

.note{padding:2.2rem 2.5rem 1.75rem 3.4rem;background-color:#FFFEF8;
  background-image:repeating-linear-gradient(to bottom,transparent 0 calc(2.2rem - 1px),#C9D5EA calc(2.2rem - 1px) 2.2rem);
  background-origin:content-box}
.note::before{content:"";position:absolute;top:0;bottom:0;left:2.4rem;width:1.5px;background:rgba(179,48,58,.45)}
.note p{margin:0;font:1.1rem/2.2rem var(--hand);color:var(--pen);white-space:pre-wrap;overflow-wrap:anywhere}
.note .sign{text-align:right}

.coupon{padding:2.25rem 2rem;text-align:center;background:#FFF4DB;outline:2.5px dashed var(--jam);outline-offset:-10px}
.coupon .good{margin:0;font:italic 1rem var(--sans);color:var(--jam)}
.coupon h3{margin:.25rem 0 .75rem;padding:0 .75rem;font-size:2rem}
.coupon .fine{margin:0 0 1rem;font-style:italic}
.coupon .redeem{margin:0;font-size:.9rem;color:#56617D}

.recipe header{margin-bottom:.5rem;padding-bottom:.5rem;border-bottom:2px solid var(--jam)}
.recipe h3{margin-bottom:.1rem}
.kitchen{margin:0;font:1rem/1.9 var(--hand);color:#56617D}
.recipe h4{margin:1rem 0 .35rem;font:400 1.15rem/1.2 var(--serif)}
.recipe ul,.recipe ol{margin:0;padding-left:1.3rem}
.recipe li + li{margin-top:.3rem}

.photo{padding:.9rem .9rem 1rem;background:#fff}
.photo img{display:block;width:100%;max-height:62vh;object-fit:contain;background:#F1EEE6;border-radius:2px}
.photo figcaption{margin-top:.6rem;text-align:center;font:1.05rem/1.9 var(--hand);color:var(--pen)}
.photo-miss{padding:2.5rem 1rem;text-align:center;background:#F4F1E8}
.photo-miss p{margin:0 0 .75rem}

@media (prefers-reduced-motion: reduce){
  .cup{transition:none}
  .tin.opening .lid,.lid.nudge{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="viewer" aria-label="What's in the cup"></dialog>

<script>
(() => {
"use strict";

const MAX = 12;
const DRAFT_KEY = "cookie-tin:draft";
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const G = g => g + "\uFE0E";

const TYPES = {
  note:   { name:"Note",   add:"Write a note",   glyph:"✎",
            fields:[{id:"text",label:"Your note",type:"textarea",req:true,ph:"Thinking of you. Drink some water and go outside for a minute."}] },
  song:   { name:"Song",   add:"Add a song",     glyph:"♪",
            hint:"Spotify, YouTube and Apple Music links play right in the tin. Other links open in a new tab.",
            fields:[{id:"title",label:"Song name",type:"text",ph:"Artist, song"},
                    {id:"url",label:"Link to the song",type:"url",req:true,ph:"https://open.spotify.com/track/…"},
                    {id:"caption",label:"Why this one (optional)",type:"text",ph:"It came on in the car and I thought of you"}] },
  photo:  { name:"Photo",  add:"Add a photo",    glyph:"◎",
            hint:"Use a direct image link, the kind that ends in .jpg, .png or .webp. A link to an album or share page opens as a link instead.",
            fields:[{id:"url",label:"Image link",type:"url",req:true,ph:"https://…/photo.jpg"},
                    {id:"caption",label:"Caption (optional)",type:"text"}] },
  video:  { name:"Video",  add:"Add a video",    glyph:"▶",
            hint:"YouTube and Vimeo links play right in the tin. Other links open in a new tab.",
            fields:[{id:"url",label:"Video link",type:"url",req:true,ph:"https://youtu.be/…"},
                    {id:"caption",label:"Caption (optional)",type:"text"}] },
  link:   { name:"Link",   add:"Add a link",     glyph:"↗",
            fields:[{id:"title",label:"What is it?",type:"text",req:true,ph:"The soup recipe I keep telling you about"},
                    {id:"url",label:"Link",type:"url",req:true,ph:"https://…"},
                    {id:"caption",label:"A note about it (optional)",type:"text"}] },
  coupon: { name:"Coupon", add:"Make a coupon",  glyph:"✂",
            fields:[{id:"title",label:"Good for",type:"text",req:true,ph:"One dog walk, no questions asked"},
                    {id:"terms",label:"Fine print (optional)",type:"text",ph:"Valid any rainy Tuesday. Never expires."}] },
  recipe: { name:"Recipe", add:"Share a recipe", glyph:"♨",
            fields:[{id:"title",label:"Recipe name",type:"text",req:true,ph:"Oatmeal cookies (ironic, we know)"},
                    {id:"ingredients",label:"Ingredients, one per line",type:"textarea",ph:"2 cups oats\n1 cup brown sugar"},
                    {id:"steps",label:"Steps, one per line",type:"textarea",ph:"Heat the oven to 350°F\nCream the butter and sugar"}] },
};

const blank = () => ({ to:"", from:"", msg:"", items:[] });
const S = { mode:"build", pkg:blank(), received:null, preview:false, editing:null, link:"", opened:new Set(), lidOpen:false, cur:0 };
const R = {};
const app = document.getElementById("app");
const dlg = document.getElementById("viewer");

/* ---------- helpers ---------- */
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()){
    if (kid == null || kid === false || kid === "") continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
function safeUrl(u){
  try { const x = new URL(String(u).trim()); return (x.protocol === "https:" || x.protocol === "http:") ? x.href : null; }
  catch { return null; }
}
const lines = s => String(s || "").split("\n").map(l => l.trim()).filter(Boolean);
const cssUrl = u => `url("${u.replace(/["\\\n]/g, c => encodeURIComponent(c))}")`;

function summary(it){
  switch (it.k){
    case "note":   return it.text.replace(/\s+/g," ").slice(0,80);
    case "song":   return it.title || hostOf(it.url);
    case "photo":  return it.caption || hostOf(it.url);
    case "video":  return it.caption || hostOf(it.url);
    default:       return it.title || "";
  }
}
function hostOf(u){ try { return new URL(u).hostname.replace(/^www\./,""); } catch { return ""; } }

/* ---------- packing into the link ---------- */
const b64u = bytes => { let s = ""; for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const unb64u = str => { str = str.replace(/-/g,"+").replace(/_/g,"/"); while (str.length % 4) str += "=";
  return Uint8Array.from(atob(str), c => c.charCodeAt(0)); };

async function pack(obj){
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if ("CompressionStream" in window){
    const stream = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw"));
    return "z" + b64u(new Uint8Array(await new Response(stream).arrayBuffer()));
  }
  return "j" + b64u(raw);
}
async function unpack(code){
  const tag = code[0], bytes = unb64u(decodeURIComponent(code.slice(1)));
  let raw;
  if (tag === "z"){
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    raw = new Uint8Array(await new Response(stream).arrayBuffer());
  } else if (tag === "j") raw = bytes;
  else throw new Error("unknown format");
  return JSON.parse(new TextDecoder().decode(raw));
}
const compact = p => ({ v:1, t:p.to.trim(), f:p.from.trim(), m:p.msg.trim(), i:p.items });
function normalize(o){
  if (!o || typeof o !== "object") throw new Error("bad package");
  const s = (v,max) => typeof v === "string" ? v.slice(0,max) : "";
  const out = { to:s(o.t ?? o.to,60), from:s(o.f ?? o.from,60), msg:s(o.m ?? o.msg,600), items:[] };
  const arr = Array.isArray(o.i ?? o.items) ? (o.i ?? o.items) : [];
  for (const it of arr.slice(0, MAX)){
    if (!it || !TYPES[it.k]) continue;
    const clean = { k:it.k };
    for (const f of TYPES[it.k].fields) clean[f.id] = s(it[f.id], f.type === "textarea" ? 4000 : 500);
    out.items.push(clean);
  }
  return out;
}

/* ---------- drafts ---------- */
function saveDraft(){ try { localStorage.setItem(DRAFT_KEY, JSON.stringify(S.pkg)); } catch {} }
function loadDraft(){ try { const v = localStorage.getItem(DRAFT_KEY); return v ? normalize(JSON.parse(v)) : null; } catch { return null; } }

/* ---------- the tin ---------- */
function cupPositions(n){
  const pts = [];
  const ring = (count, r, offset) => { for (let i = 0; i < count; i++){
    const a = offset + i * 2 * Math.PI / count - Math.PI / 2;
    pts.push([50 + r * Math.cos(a), 50 + r * Math.sin(a)]); } };
  if (n === 1) pts.push([50,50]);
  else if (n > 1 && n <= 6) ring(n, n <= 3 ? 20 : 27, 0);
  else if (n > 6){ const inner = n <= 9 ? 3 : 4; ring(inner, n <= 9 ? 14 : 16, Math.PI / 8); ring(n - inner, 34, 0); }
  return pts;
}

function makeTin(pkg, mode){
  const tin = h("div", { class:"tin" + (mode === "build" ? " parked" : "") });
  const base = h("div", { class:"tin-base" }, h("div", { class:"tin-liner" }));
  const cups = h("div", { class:"cups" });
  base.append(cups);
  if (mode === "receive") base.inert = true;
  if (!pkg.items.length && mode === "build") base.append(h("p", { class:"tin-empty" }, "Empty for now"));
  const pos = cupPositions(pkg.items.length);
  pkg.items.forEach((it, i) => {
    const cup = h("button", { type:"button", class:"cup", "data-i":i, style:`left:${pos[i][0]}%;top:${pos[i][1]}%` },
      h("span", { class:"cup-inner", "aria-hidden":"true" }));
    paintCup(cup, it, mode, false);
    cups.append(cup);
  });
  const lidProps = mode === "receive" ? { type:"button", class:"lid", "aria-label":"Open the tin" } : { class:"lid", "aria-hidden":"true" };
  const lid = h(mode === "receive" ? "button" : "div", lidProps,
    h("span", { class:"lid-oval" },
      h("span", { class:"lid-small" }, "An assortment for"),
      h("span", { class:"lid-name" }),
      h("span", { class:"lid-from" })));
  tin.append(base, lid);
  fillLid(tin, pkg);
  return tin;
}
function fillLid(tin, pkg){
  tin.querySelector(".lid-name").textContent = pkg.to.trim() || "someone";
  const f = pkg.from.trim();
  tin.querySelector(".lid-from").textContent = f ? "from " + f : "";
}
function paintCup(cup, it, mode, opened){
  const inner = cup.firstChild, t = TYPES[it.k], n = +cup.dataset.i + 1;
  inner.className = "cup-inner"; inner.textContent = ""; inner.style.backgroundImage = "";
  if (mode === "receive" && !opened){
    inner.classList.add("cookie");
    cup.setAttribute("aria-label", `Cup ${n}, not opened yet`);
    return;
  }
  const img = it.k === "photo" && safeUrl(it.url);
  if (img){
    inner.style.backgroundImage = cssUrl(img);
    const probe = new Image();
    probe.onerror = () => { inner.style.backgroundImage = ""; inner.textContent = G(t.glyph); };
    probe.src = img;
  } else inner.textContent = G(t.glyph);
  cup.setAttribute("aria-label", mode === "build" ? `Edit cup ${n}: ${t.name.toLowerCase()}` : `Cup ${n}: ${t.name.toLowerCase()}, opened`);
  if (opened) cup.classList.add("opened");
}

/* ---------- header ---------- */
function siteHeader(){
  return h("header", { class:"site" },
    h("h1", { class:"wordmark" }, h("a", { href:"#", onclick:e => { e.preventDefault(); goBuild(); } }, "The Cookie Tin")),
    h("p", { class:"tagline" }, "A care package that looks like cookies. It’s never cookies."));
}

/* ---------- build ---------- */
function renderBuild(){
  const p = S.pkg;
  R.stage = h("div", { class:"stage" });
  refreshTin();

  const field = (label, el) => h("label", { class:"field" }, h("span", {}, label), el);
  const to = h("input", { type:"text", maxlength:"60", placeholder:"Who it’s for", autocomplete:"off" }); to.value = p.to;
  const from = h("input", { type:"text", maxlength:"60", placeholder:"Your name", autocomplete:"off" }); from.value = p.from;
  const msg = h("textarea", { maxlength:"600", placeholder:"Open it slowly. Or don’t, I’m not your mom." }); msg.value = p.msg;
  to.addEventListener("input", () => { p.to = to.value; touched(false); });
  from.addEventListener("input", () => { p.from = from.value; touched(false); });
  msg.addEventListener("input", () => { p.msg = msg.value; touched(false); });

  R.count = h("p", { class:"help" });
  R.types = h("div", { class:"types" });
  for (const [k,t] of Object.entries(TYPES)){
    R.types.append(h("button", { type:"button", class:"type-btn", onclick:() => startEdit(k, null) },
      h("span", { class:"mini-cup", "aria-hidden":"true" }, h("span", {}, G(t.glyph))), t.add));
  }
  R.editor = h("div");
  R.items = h("ol", { class:"items", "aria-label":"What’s in the tin" });
  R.make = h("button", { type:"button", class:"btn", onclick:makeLink }, "Make the link");
  R.prev = h("button", { type:"button", class:"btn ghost", onclick:startPreview }, "Preview");
  R.linkBox = h("div", { class:"linkout" });

  const sheet = h("div", { class:"sheet" },
    h("section", {},
      h("h2", {}, "Label the lid"),
      h("div", { class:"row2" }, field("For", to), field("From", from)),
      field("Something to read when it opens (optional)", msg)),
    h("section", {},
      h("h2", {}, "Fill the tin"),
      R.count, R.types, R.editor, R.items),
    h("section", {},
      h("h2", {}, "Close the lid"),
      h("p", { class:"help" }, "Everything in the tin is packed into the link itself, so nothing gets stored anywhere. If you change something, make a new link."),
      h("div", { class:"actions" }, R.make, R.prev),
      R.linkBox,
      h("div", { class:"startover" }, h("button", { type:"button", class:"btn plain danger", onclick:startOver }, "Empty the tin and start over"))));

  app.append(siteHeader(), h("main", { class:"build" }, R.stage, sheet));
  refreshItems(); renderEditor(); renderLinkBox();
}

function refreshTin(){
  R.tin = makeTin(S.pkg, "build");
  R.tin.querySelectorAll(".cup").forEach(c => c.addEventListener("click", () => startEdit(S.pkg.items[c.dataset.i].k, +c.dataset.i)));
  R.stage.replaceChildren(R.tin);
}
function refreshItems(){
  const items = S.pkg.items;
  R.count.textContent = items.length
    ? `${items.length} of ${MAX} cups filled. They come out in this order.`
    : `The tin holds ${MAX} things. Pick something for the first cup.`;
  R.types.querySelectorAll("button").forEach(b => b.disabled = items.length >= MAX);
  R.make.disabled = R.prev.disabled = !items.length;
  R.items.replaceChildren(...items.map((it, i) => {
    const t = TYPES[it.k], name = t.name.toLowerCase();
    return h("li", {},
      h("span", { class:"mini-cup", "aria-hidden":"true" }, h("span", {}, G(t.glyph))),
      h("div", { class:"summary" }, h("b", {}, t.name), h("span", {}, summary(it))),
      h("div", { class:"tools" },
        h("button", { type:"button", class:"icon-btn", "aria-label":`Move ${name} up`, disabled:i === 0, onclick:() => move(i,-1) }, "↑"),
        h("button", { type:"button", class:"icon-btn", "aria-label":`Move ${name} down`, disabled:i === items.length - 1, onclick:() => move(i,1) }, "↓"),
        h("button", { type:"button", class:"icon-btn", onclick:() => startEdit(it.k, i) }, "Edit")));
  }));
}
function move(i, d){
  const a = S.pkg.items, j = i + d;
  [a[i], a[j]] = [a[j], a[i]];
  touched(true);
}
function touched(structural){
  saveDraft();
  S.link = ""; renderLinkBox();
  if (structural){ refreshTin(); refreshItems(); }
  else fillLid(R.tin, S.pkg);
}

function startEdit(k, index){
  if (index == null && S.pkg.items.length >= MAX) return;
  S.editing = { k, index, values: index == null ? {} : { ...S.pkg.items[index] } };
  renderEditor(true);
}
function renderEditor(focus){
  const e = S.editing;
  if (!e){ R.editor.replaceChildren(); return; }
  const t = TYPES[e.k];
  const box = h("div", { class:"editor", role:"group", "aria-label": e.index == null ? t.add : `Edit ${t.name.toLowerCase()}` },
    h("h3", {}, e.index == null ? t.add : `Edit cup ${e.index + 1}`),
    t.hint && h("p", { class:"help" }, t.hint));
  const inputs = [];
  for (const fd of t.fields){
    const el = fd.type === "textarea"
      ? h("textarea", { placeholder:fd.ph || "", maxlength:"4000" })
      : h("input", { type:fd.type === "url" ? "url" : "text", placeholder:fd.ph || "", maxlength:"500", inputmode:fd.type === "url" ? "url" : null });
    el.value = e.values[fd.id] || "";
    el.addEventListener("input", () => { e.values[fd.id] = el.value; });
    const err = h("p", { class:"err", hidden:true });
    inputs.push({ el, err, fd });
    box.append(h("label", { class:"field" }, h("span", {}, fd.label), el, err));
  }
  const save = () => {
    let first = null;
    for (const { el, err, fd } of inputs){
      const v = el.value.trim();
      let m = "";
      if (fd.req && !v) m = "Fill this in to put it in the tin.";
      else if (fd.type === "url" && v && !safeUrl(v)) m = "Use a full link that starts with https://";
      err.textContent = m; err.hidden = !m;
      if (m){ el.setAttribute("aria-invalid","true"); first = first || el; } else el.removeAttribute("aria-invalid");
    }
    if (first){ first.focus(); return; }
    const item = { k:e.k };
    for (const { el, fd } of inputs){ const v = el.value.trim(); item[fd.id] = fd.type === "url" ? (safeUrl(v) || "") : v; }
    if (e.index == null) S.pkg.items.push(item); else S.pkg.items[e.index] = item;
    S.editing = null; renderEditor(); touched(true);
  };
  const actions = h("div", { class:"actions" },
    h("button", { type:"button", class:"btn", onclick:save }, e.index == null ? "Put it in the tin" : "Save changes"),
    h("button", { type:"button", class:"btn ghost", onclick:() => { S.editing = null; renderEditor(); } }, "Cancel"));
  if (e.index != null) actions.append(h("button", { type:"button", class:"btn plain danger",
    onclick:() => { S.pkg.items.splice(e.index, 1); S.editing = null; renderEditor(); touched(true); } }, "Take it out"));
  box.append(actions);
  R.editor.replaceChildren(box);
  if (focus){
    box.scrollIntoView({ block:"nearest", behavior: reduce ? "auto" : "smooth" });
    const first = box.querySelector("input,textarea");
    if (first) first.focus({ preventScroll:true });
  }
}

async function makeLink(){
  if (!S.pkg.items.length) return;
  const code = await pack(compact(S.pkg));
  S.link = location.href.split("#")[0] + "#p=" + code;
  renderLinkBox();
}
function renderLinkBox(){
  const b = R.linkBox;
  if (!b) return;
  b.replaceChildren();
  if (!S.link) return;
  const inp = h("input", { type:"text", readonly:true, "aria-label":"Link to your tin" });
  inp.value = S.link;
  inp.addEventListener("focus", () => inp.select());
  const copied = h("span", { class:"copied", role:"status" });
  const copy = h("button", { type:"button", class:"btn", onclick: async () => {
    try { await navigator.clipboard.writeText(S.link); }
    catch { inp.focus(); inp.select(); try { document.execCommand("copy"); } catch {} }
    copied.textContent = "Copied";
    setTimeout(() => { copied.textContent = ""; }, 2200);
  } }, "Copy link");
  b.append(inp, h("div", { class:"actions" }, copy, copied));
  if (S.link.length > 2000) b.append(h("p", { class:"warn" },
    `This link is ${S.link.length.toLocaleString()} characters long. It works in texts, email and most apps, but a few trim long links. Shorter notes and recipes make it shorter.`));
}
function startOver(){
  if (!confirm("Empty the tin and start over?")) return;
  S.pkg = blank(); S.editing = null; S.link = "";
  saveDraft(); render();
}

/* ---------- receive ---------- */
function startPreview(){
  if (!S.pkg.items.length) return;
  S.received = normalize(compact(S.pkg));
  S.preview = true; S.mode = "receive";
  render();
}
function renderReceive(){
  S.opened = new Set(); S.lidOpen = false;
  const p = S.received;
  if (S.preview) app.append(h("div", { class:"preview-bar" },
    h("span", {}, "Preview of what they’ll see"),
    h("button", { type:"button", class:"btn", onclick:() => { S.preview = false; S.mode = "build"; render(); } }, "Back to editing")));
  app.append(siteHeader());
  const stage = h("div", { class:"stage" });
  R.rtin = makeTin(p, "receive");
  stage.append(R.rtin);
  R.hint = h("p", { class:"hint", role:"status" });
  R.after = h("div");
  app.append(h("main", { class:"receive on-table" }, stage, R.hint, R.after));

  const lid = R.rtin.querySelector(".lid");
  lid.addEventListener("click", openLid);
  R.rtin.querySelectorAll(".cup").forEach(c => c.addEventListener("click", () => showItem(+c.dataset.i)));
  updateReceive();
  if (!reduce) setTimeout(() => { if (!S.lidOpen) lid.classList.add("nudge"); }, 1400);
}
function openLid(){
  if (S.lidOpen) return;
  S.lidOpen = true;
  const tin = R.rtin, lid = tin.querySelector(".lid");
  const hadFocus = document.activeElement === lid;
  lid.classList.remove("nudge");
  lid.disabled = true; lid.setAttribute("aria-hidden","true");
  tin.querySelector(".tin-base").inert = false;
  const settle = () => {
    tin.classList.remove("opening"); tin.classList.add("parked");
    if (hadFocus){ const c = tin.querySelector(".cup"); if (c) c.focus({ preventScroll:true }); }
  };
  if (reduce) settle();
  else { tin.classList.add("opening"); lid.addEventListener("animationend", settle, { once:true }); }
  updateReceive();
}
function updateReceive(){
  const p = S.received, n = p.items.length, o = S.opened.size;
  R.hint.textContent =
    !S.lidOpen ? "Tap the lid to open it." :
    !n ? "This tin is empty. Someone forgot to fill it." :
    o === 0 ? `${n} ${n === 1 ? "cup" : "cups"} inside. Tap one to see what’s in it.` :
    o < n ? `${o} of ${n} opened. Tap another cup.` : "";
  R.after.replaceChildren();
  if (S.lidOpen && p.msg) R.after.append(h("p", { class:"slip" }, p.msg + (p.from ? `\n— ${p.from}` : "")));
  if (S.lidOpen && n && o === n){
    R.after.append(h("div", { class:"done" },
      h("p", {}, "That’s everything. Still no cookies."),
      !S.preview && h("div", { class:"actions center" },
        h("button", { type:"button", class:"btn", onclick:makeOneBack }, "Make a tin back"),
        h("button", { type:"button", class:"btn plain", onclick:editCopy }, "Edit a copy of this tin"))));
  }
}

function showItem(i){
  const p = S.received, n = p.items.length;
  S.cur = i;
  if (!S.opened.has(i)){
    S.opened.add(i);
    paintCup(R.rtin.querySelector(`.cup[data-i="${i}"]`), p.items[i], "receive", true);
    updateReceive();
  }
  const card = itemCard(p.items[i], p);
  const close = h("button", { type:"button", class:"x", "aria-label":"Close", onclick:() => dlg.close() }, "×");
  card.prepend(close);
  const nav = h("div", { class:"cardnav" },
    h("button", { type:"button", class:"chip", disabled:i === 0, onclick:() => showItem(i - 1) }, "Previous"),
    h("span", { class:"count" }, `Cup ${i + 1} of ${n}`),
    h("button", { type:"button", class:"chip", disabled:i === n - 1, onclick:() => showItem(i + 1) }, "Next"));
  dlg.replaceChildren(card, nav);
  if (!dlg.open) dlg.showModal();
  close.focus();
}
dlg.addEventListener("close", () => {
  dlg.replaceChildren();
  const cup = R.rtin && R.rtin.querySelector(`.cup[data-i="${S.cur}"]`);
  if (cup) cup.focus({ preventScroll:true });
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

function embedFor(raw){
  const u = safeUrl(raw);
  if (!u) return null;
  const x = new URL(u), host = x.hostname.replace(/^(www|m)\./, "");
  let id = null;
  if (host === "youtu.be") id = x.pathname.slice(1).split("/")[0];
  else if (host === "youtube.com" || host.endsWith(".youtube.com")){
    id = x.searchParams.get("v");
    if (!id){ const m = x.pathname.match(/\/(?:shorts|embed|live)\/([\w-]{11})/); id = m && m[1]; }
  }
  if (id && /^[\w-]{11}$/.test(id)) return { src:`https://www.youtube-nocookie.com/embed/${id}`, video:true };
  if (host === "open.spotify.com"){
    const m = x.pathname.match(/^\/(?:intl-[\w-]+\/)?(track|album|playlist|episode|show|artist)\/([A-Za-z0-9]+)/);
    if (m) return { src:`https://open.spotify.com/embed/${m[1]}/${m[2]}`, h:(m[1] === "track" || m[1] === "episode") ? 152 : 352 };
  }
  if (host === "vimeo.com"){ const m = x.pathname.match(/^\/(\d+)/); if (m) return { src:`https://player.vimeo.com/video/${m[1]}`, video:true }; }
  if (host === "music.apple.com") return { src:`https://embed.music.apple.com${x.pathname}${x.search}`, h:x.searchParams.get("i") ? 175 : 450 };
  return null;
}
function embedEl(e, title){
  return h("div", { class:"embed" + (e.video ? " video" : ""), style:e.h ? `height:${e.h}px` : null },
    h("iframe", { src:e.src, title, loading:"lazy", allowfullscreen:true, referrerpolicy:"strict-origin-when-cross-origin",
      allow:"autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" }));
}
function linkBtn(url, text){
  const u = safeUrl(url);
  return u ? h("a", { class:"btn", href:u, target:"_blank", rel:"noopener noreferrer" }, text)
           : h("p", {}, "The link in this cup doesn’t work.");
}
function itemCard(it, p){
  const from = p.from.trim();
  switch (it.k){
    case "note":
      return h("article", { class:"card note" }, h("p", {}, it.text), from ? h("p", { class:"sign" }, "— " + from) : null);
    case "song": {
      const e = embedFor(it.url);
      return h("article", { class:"card" }, h("h3", {}, it.title || "Something to listen to"),
        e ? embedEl(e, "Song player") : linkBtn(it.url, "Listen"),
        it.caption ? h("p", { class:"caption" }, it.caption) : null);
    }
    case "video": {
      const e = embedFor(it.url);
      return h("article", { class:"card" }, h("h3", {}, it.caption || "Something to watch"),
        e ? embedEl(e, "Video player") : linkBtn(it.url, "Watch it"));
    }
    case "photo": {
      const url = safeUrl(it.url);
      const fig = h("figure", { class:"card photo" });
      if (url){
        const img = h("img", { src:url, alt:it.caption || "A photo from " + (from || "the sender"), referrerpolicy:"no-referrer" });
        img.addEventListener("error", () => img.replaceWith(h("div", { class:"photo-miss" },
          h("p", {}, "This photo lives on another page."), linkBtn(it.url, "Open the photo"))));
        fig.append(img);
      } else fig.append(h("div", { class:"photo-miss" }, h("p", {}, "The link in this cup doesn’t work.")));
      if (it.caption) fig.append(h("figcaption", {}, it.caption));
      return fig;
    }
    case "link":
      return h("article", { class:"card" }, h("h3", {}, it.title),
        it.caption ? h("p", { class:"caption" }, it.caption) : null, linkBtn(it.url, "Open it"));
    case "coupon":
      return h("article", { class:"card coupon" },
        h("p", { class:"good" }, "This coupon is good for"),
        h("h3", {}, it.title),
        it.terms ? h("p", { class:"fine" }, it.terms) : null,
        h("p", { class:"redeem" }, from ? `Redeem with ${from}. No receipt needed.` : "No receipt needed."));
    case "recipe": {
      const ing = lines(it.ingredients), steps = lines(it.steps);
      return h("article", { class:"card recipe" },
        h("header", {}, h("h3", {}, it.title), from ? h("p", { class:"kitchen" }, "From the kitchen of " + from) : null),
        ing.length ? h("section", {}, h("h4", {}, "Ingredients"), h("ul", {}, ing.map(l => h("li", {}, l)))) : null,
        steps.length ? h("section", {}, h("h4", {}, "Steps"), h("ol", {}, steps.map(l => h("li", {}, l)))) : null);
    }
  }
}

function makeOneBack(){
  const r = S.received;
  S.pkg = { to:r.from, from:r.to, msg:"", items:[] };
  saveDraft(); goBuild();
}
function editCopy(){
  S.pkg = JSON.parse(JSON.stringify(S.received));
  saveDraft(); goBuild();
}

/* ---------- error ---------- */
function renderError(){
  app.append(siteHeader(), h("main", { class:"receive" },
    h("div", { class:"sheet error-sheet" },
      h("h2", {}, "This link is incomplete"),
      h("p", {}, "Part of the link is missing or was changed, so the tin can’t be opened. Ask whoever sent it to copy the whole link again."),
      h("button", { type:"button", class:"btn", onclick:goBuild }, "Make your own tin"))));
}

/* ---------- routing ---------- */
function render(){
  if (dlg.open) dlg.close();
  app.replaceChildren();
  if (S.mode === "build") renderBuild();
  else if (S.mode === "receive") renderReceive();
  else renderError();
  window.scrollTo(0, 0);
}
function goBuild(){
  if (location.hash) history.replaceState(null, "", location.href.split("#")[0]);
  S.mode = "build"; S.preview = false; S.editing = null; S.link = "";
  render();
}
async function route(){
  const hash = location.hash;
  if (hash.startsWith("#p=")){
    try { S.received = normalize(await unpack(hash.slice(3))); S.mode = "receive"; S.preview = false; }
    catch { S.mode = "error"; }
  } else S.mode = "build";
  render();
}
window.addEventListener("hashchange", route);

S.pkg = loadDraft() || blank();
route();
})();
</script>
